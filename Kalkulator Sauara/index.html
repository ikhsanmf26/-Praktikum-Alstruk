<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kalkulator Suara</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="calculator">

        <div class="header">
            <div class="icon">🎙️</div>

            <h1>Kalkulator Suara</h1>

            <p>
                Ucapkan operasi matematika dan biarkan sistem
                menghitungnya untukmu.
            </p>
        </div>

        <button id="micButton" class="mic-button">
            <span>🎤</span>
        </button>

        <div id="status" class="status">
            Tekan mikrofon untuk mulai
        </div>

        <section class="card">

            <div class="label">
                Yang kamu ucapkan
            </div>

            <div id="voiceText" class="voice-text">
                -
            </div>

        </section>

        <section class="result-card">

            <div class="label">
                Hasil perhitungan
            </div>

            <div id="calculation" class="calculation">
                -
            </div>

            <div id="result" class="result">
                -
            </div>

        </section>

        <section class="examples">

            <h3>Coba ucapkan</h3>

            <button class="example">
                "empat tambah enam"
            </button>

            <button class="example">
                "dua puluh lima tambah lima"
            </button>

            <button class="example">
                "seratus dikurangi tiga puluh"
            </button>

            <button class="example">
                "dua puluh kali lima"
            </button>

            <button class="example">
                "seratus dibagi empat"
            </button>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
